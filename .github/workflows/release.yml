name: release

# 触发方式：
#   1) push 一个 `v*` tag —— 真正发版：build → test → package → 建 GitHub Release。
#   2) workflow_dispatch —— 手动干跑：build → test → package，但不建 Release，
#      用来在合并/改动这个 workflow 后验证流程本身是否能跑通。
#      `dry_run` 输入目前恒为“干跑”（release job 只在 tag push 时才跑），
#      保留这个输入是为了在 Actions 界面上明确告诉触发者这次不会发版，
#      并为未来需要区分干跑细节时留一个开关位。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "干跑：只构建和打包，不创建 Release（当前 workflow_dispatch 触发下始终如此）"
        type: boolean
        default: true

# 顶层只给最小权限；真正需要写权限（创建 Release）的 job 单独声明。
permissions:
  contents: read

jobs:
  build:
    name: build + test + package (aarch64-apple-darwin)
    runs-on: macos-14
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      checksum: ${{ steps.package.outputs.checksum }}
    steps:
      # fetch-depth: 0 —— 下面的「tag 必须指向 main 上的提交」检查要用
      # `git merge-base --is-ancestor`，需要完整历史，浅克隆不够。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # 防止有人从一个未经评审/未合并的分支直接打 tag 发版：tag 指向的提交
      # 必须已经是 origin/main 的祖先。只对真正的 tag push 生效，干跑
      # （workflow_dispatch）不检查——干跑本来就允许在任意分支上验证流程。
      # $GITHUB_SHA / $GITHUB_REF_NAME 是 Actions runner 自动注入的环境变量
      # （不是 `${{ }}` 模板插值），shell 侧直接引用是安全的。
      - name: Require tag to point at a commit on main
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME（commit $GITHUB_SHA）不在 origin/main 的历史里，拒绝发版" >&2
            exit 1
          fi

      # 与 .github/workflows/ci.yml 的 rust job 保持一致：显式安装
      # rust-toolchain.toml 里钉住的版本，不依赖 runner 预装的默认工具链。
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95 --profile minimal --component rustfmt,clippy

      # 发版前置门禁：测试不过，后面的 build/package 步骤不会执行，
      # release job（needs: build）也就不会跑，不会发出一个没过测试的版本。
      - name: cargo test --workspace
        run: cargo test --workspace --locked

      - name: cargo build --release -p idoris-router
        run: cargo build --release --locked -p idoris-router

      # $GITHUB_EVENT_NAME/$GITHUB_REF_NAME/$GITHUB_SHA 都是 runner 自动注入
      # 的环境变量，不是模板插值进脚本文本——tag 名允许包含 shell 元字符
      # （`$()`、`` ` ``、`;` 等），凡是会被当成 tag 值使用的地方一律走环境
      # 变量 + 双引号，不直接把 `${{ ... }}` 插进 `run:` 脚本里。
      - name: Determine version string
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::tag \"$GITHUB_REF_NAME\" 不符合 vX.Y.Z[-prerelease] 格式，拒绝发版" >&2
              exit 1
            fi
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dryrun-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      # steps.version.outputs.tag 不是 runner 内置环境变量，必须显式经
      # `env:` 传入（而不是直接插进 `run:` 脚本文本）才不会有脚本注入风险；
      # 此时它已经在上一步过了 vX.Y.Z 格式校验（干跑分支是固定的
      # `dryrun-<7 位 sha>`），双重保险。
      - name: Package binary + sha256
        id: package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          archive="idoris-${TAG}-aarch64-apple-darwin.tar.gz"
          checksum="${archive}.sha256"
          tar czf "$archive" -C target/release idoris
          shasum -a 256 "$archive" > "$checksum"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=${checksum}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: create GitHub Release
    needs: build
    # 只有真正的 `v*` tag push 才发版；workflow_dispatch（干跑）永远停在 build。
    if: ${{ github.event_name == 'push' }}
    # 这个 job 只下载 build 产物、调用 gh CLI 建 Release，不需要 macOS 机器
    # ——用 ubuntu-latest 省 macOS 分钟数。
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets

      # needs.build.outputs.* 不是 runner 内置环境变量，显式经 `env:` 传入；
      # $GITHUB_REF_NAME/$GITHUB_REPOSITORY 是内置环境变量，直接引用即可。
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
          CHECKSUM: ${{ needs.build.outputs.checksum }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" \
            "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
