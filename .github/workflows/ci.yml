name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本由根 package.json 的 packageManager 字段决定；此处不得再写 version
      # （pnpm/action-setup@v4 在两处不等时直接 ERR_PNPM_BAD_PM_VERSION）。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:contract-drift
      - run: pnpm build
      - run: pnpm test
      # R0：语言无关的黑盒 HTTP 契约测试套件，独立 step（不并入 pnpm test，避免拖慢现有门禁）。
      - run: pnpm conformance

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rust job 独立安装 conformance 所需的 TS 构建与测试工具。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.95 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      # idoris-tenancy/test-bins gates the budget_mp_worker test helper
      # binary out of default builds (Opus Tier-2 acceptance L6); enabling
      # it here keeps its multi-process concurrency tests a required part of
      # this gate rather than something a plain local `cargo test` happens
      # to skip (M4). idoris-tenancy/mutation-test-hooks gates a
      # deterministic split-transaction mutation-testing hook the same way
      # (Opus Tier-2 re-review B-8) — also required here, not optional.
      - run: cargo clippy --all-targets --features idoris-tenancy/test-bins,idoris-tenancy/mutation-test-hooks -- -D warnings
      - run: cargo test --features idoris-tenancy/test-bins,idoris-tenancy/mutation-test-hooks
      - name: Rust release conformance
        # 正控：外部命令指向坏路径时，脚本仍必须选择本次 release 产物。
        env:
          IDORIS_CONFORMANCE_CMD: /idoris-conformance-missing
          IDORIS_CONFORMANCE_ARGV: '["/idoris-conformance-missing"]'
        run: bash scripts/conformance-rust.sh
      - name: Conformance 错误命令负对照
        shell: bash
        run: |
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if IDORIS_CONFORMANCE_ARGV='["/idoris-conformance-missing"]' pnpm conformance >"$log" 2>&1; then
            cat "$log"
            echo "错误被测命令未使 conformance 失败" >&2
            exit 1
          fi
          cat "$log"
          grep -q '被测服务启动命令执行失败.*idoris-conformance-missing.*ENOENT' "$log"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
