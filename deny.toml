# cargo-deny config — 与 Agent24（/Users/jason/Dev/auraai/Agent24/rust/deny.toml）
# 保持一致的 license 白名单：不允许 GPL/AGPL 进依赖树。
# CI 跑 `cargo deny check advisories bans licenses sources`（见 .github/workflows/ci.yml 的 rust job）。

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # webpki-roots（Mozilla CA 数据，经 rustls/reqwest 传入）——宽松的数据许可证
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "warn"
ignore = [
  # RUSTSEC-2024-0436 — `paste` (dtolnay) is archived/no-longer-maintained,
  # not a vulnerability (no CVE, no exploit, the advisory itself says
  # "No safe upgrade is available"). It's a compile-time-only proc-macro
  # crate with no runtime code shipped into the built binary, pulled in
  # transitively via `genai` (R2-E remote client, `idoris-upstream`) — not
  # a direct dependency we could swap for `pastey` ourselves without
  # `genai` doing so upstream first. Revisit if `genai` drops it or a
  # CVE is ever filed against `paste` itself (this entry only silences the
  # maintenance-status notice, not an actual vulnerability class).
  "RUSTSEC-2024-0436",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
