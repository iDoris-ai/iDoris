[workspace]
resolver = "2"
members = [
    "crates/idoris-contracts",
    "crates/idoris-backend",
    "crates/idoris-router",
    "crates/idoris-tenancy",
    "crates/idoris-recommender",
    "crates/idoris-policy",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iDoris-ai/iDoris"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
# Default features pull in `reqwest` (for resolving remote `$ref`s over HTTP),
# which we don't need — `tests/parity.rs` inlines the one local `$ref` it
# encounters by hand. Disabling default features keeps the dependency (and
# cargo-deny license/bans surface) much smaller.
jsonschema = { version = "0.30", default-features = false }

idoris-contracts = { path = "crates/idoris-contracts" }
idoris-backend = { path = "crates/idoris-backend" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# R1 骨架约定：核心路径禁 unwrap/expect（测试内允许，见各 crate 的 `[lints]` 覆盖）。
unwrap_used = "deny"
expect_used = "deny"
