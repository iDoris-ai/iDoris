[package]
name = "idoris-tenancy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust design for packages/tenancy (tenant scoping, budget, billing). R2-C implements a new SQLite-backed budget ledger (atomic reserve/settle/release), informed by but not a line-for-line port of packages/tenancy/src/budget.ts; store/billing are still skeletons — see README.md."

[lints]
workspace = true

[features]
# Opus Tier-2 acceptance L6: `budget_mp_worker` exists only to be spawned by
# the multi-process concurrency test (`tests/budget_concurrency.rs`) — it
# has no reason to be built as part of a normal `cargo build`/publish of
# this crate. CI passes `--features idoris-tenancy/test-bins` explicitly
# (see `.github/workflows/ci.yml`), so this is opt-in at the Cargo level,
# not skippable as a CI gate (M4).
test-bins = []

[[bin]]
name = "budget_mp_worker"
path = "src/bin/budget_mp_worker.rs"
required-features = ["test-bins"]

[dependencies]
idoris-contracts = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
