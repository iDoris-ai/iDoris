[package]
name = "idoris-upstream"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Upstream inference clients: local RuntimeAdapter implementations (oMLX) and remote RemoteChat provider clients (OpenAI/Anthropic-compatible), behind stable, non-spoofable error reason codes."

[lints]
workspace = true

[dependencies]
idoris-backend = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# Only the `Stream` trait — not the full `futures` umbrella crate — to keep
# this PR's dependency surface to exactly what `RemoteChat::chat_stream`'s
# signature needs. The concrete stream implementations (oMLX has none;
# the remote `genai`-backed client does) arrive in a later PR alongside
# whatever runtime (`genai` already pulls in `futures`) they need.
futures-core = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
