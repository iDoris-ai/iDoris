[package]
name = "idoris-recommender"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust hardware-aware model recommender for iDoris."

[lints]
workspace = true

[dependencies]
idoris-contracts = { workspace = true }
idoris-policy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[target.'cfg(unix)'.dependencies]
# 按句柄逐级打开模型目录（openat、fdopendir、fstatat）：`fs` 与 `dir` 都是 nix 自己的 feature，没有新增 crate。
nix = { workspace = true, features = ["fs", "dir"] }

[dev-dependencies]
tempfile = "3"
