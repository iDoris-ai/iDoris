[package]
name = "idoris-backend"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Engine-agnostic RuntimeAdapter trait for local inference runtimes (formerly ModelBackend), loosely mirroring packages/adapters/src/backend.ts."

[lints]
workspace = true

[dependencies]
idoris-contracts = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
# The Supervisor event loop itself (`spawn`/`sync::{mpsc,oneshot}`) is
# regular `src` code, not test-only — so `tokio` has to be a normal
# dependency here, not a dev-dependency. Only the workspace's default
# features; `test-util` (for a future PR's `#[tokio::test(start_paused =
# true)]`) belongs on the dev-dependency below instead, not here — Cargo
# unifies features across `[dependencies]`/`[dev-dependencies]` of the same
# package for test builds, so it's still available to tests, but a
# `cargo build` (no dev-deps) doesn't carry test-only behavior into the
# production dependency.
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true }
