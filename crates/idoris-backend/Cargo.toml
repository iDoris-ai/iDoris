[package]
name = "idoris-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Engine-agnostic RuntimeAdapter trait for local inference runtimes (formerly ModelBackend), loosely mirroring packages/adapters/src/backend.ts."

[lints]
workspace = true

[dependencies]
idoris-contracts = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
# `test-util` (for `#[tokio::test(start_paused = true)]`'s virtual clock) is
# only exercised by this crate's own tests, but the Supervisor event loop
# itself (`spawn`/`sync::{mpsc,oneshot}`/`time::sleep`) is regular `src`
# code, not test-only — so `tokio` has to be a normal dependency here, not
# a dev-dependency.
tokio = { workspace = true, features = ["test-util"] }

[dev-dependencies]
serde_json = { workspace = true }
