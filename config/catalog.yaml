# iDoris 模型目录 · v1（T2.1.2）
#
# 真源：
#   - docs/13-本地模型候选-硬件与场景匹配.md 附录 A（2026-09-19 HF 字节数核验）
#   - docs/07-模型量化内存评估与动态推荐.md §5.2（ornith-1.0-9b / agents-a1-35b 两条，验收基线）
#
# 体积口径：weights_gb = HF 实测文件字节数（十进制 GB）；只有 bpp 时按 docs/07 §2 表。
# KV 不写死在目录里，由 arch 现算：
#   kv_bytes = 2 * n_layers * n_kv_heads * head_dim * ctx * kv_bytes_per_element
#   （docs/13 §10.1 修正：Ornith/Qwen3.5 9B 系 arch = 32 层 / 4 KV head / head_dim 256）
# 与 docs/07 §5.2 的旧 arch（36/8/128）不同——用旧值会把 KV 高估 12.5%。
#
# 字段：
#   roles: [fast|core|deep|temp]  仅 core 参与常驻自动推荐
#   min_ram_gb: 硬门槛，ram_gb < min_ram_gb 一律 BLOCKED（docs/13 §9.2 ①）
#   status: experiment 的条目不进自动推荐（docs/13 §1.4 Ornith 系警告）
