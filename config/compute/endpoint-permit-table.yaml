      本行不是自助默认。它要求人把账户或请求设成 ZDR only，并排除 Safety Retention。即便如此，疑似 CSAM 仍可能被留存，所以留存是有例外，不是 zdr。具体模型当前落到哪家下游，本次未登录，未核实，因此模型 id 用 route-policy，不填某一个模型名。处理区域未核实：企业与商业方案另有 eu 与 us 主机名，没有公开的亚太主机名。网关接受 OpenAI 形状的 tools，流在结束前带 usage，并支持 json_schema；下游不支持时会失败或改写。缓存是否打折取决于下游，写 false。取消只覆盖名单内下游，本行不绑定单一下游，写 false。自助条款禁止为转售 API 或建设竞争服务而使用。企业协议第 2.1(a)(ii) 条允许提供给终端客户，第 2.3.7 条禁止转租转卖，定性待律师确认。账户持有人须年满 18 岁。DPA 未签。抽成和模型现价未核实。允许的数据类别未核实。
