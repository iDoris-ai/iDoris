# 端点级许可表（正式文件，schema_version 1）
#
# 由 docs/design/compute-service-endpoint-table.draft.yaml 按
# crates/idoris-compute-contracts/src/permit.rs 的 schema 收成。
# 叙述和出处见 docs/design/compute-service-endpoint-verification.md（查询日期 2026-11-12）。
# 调用 URL 不在本文件。S4 按 (provider, model, endpoint) 这个 EndpointKey 去
# config/compute/endpoint-urls.md 找 URL。
#
# 最坏值（permit.rs「没核实的值怎么写」）：
#   allowed_data_classes: [] 、retention: retained 、dpa: unsigned 、
#   能力 false 、processing_regions: [unknown]
# 草案写 unverified、或该字段没有核实到可以放宽的结论时，用上面的值。
# dpa 一律 unsigned：本项目没有签署任何一份 DPA。
# 因此没有任何一条写入 child_edu（加载器会拒绝 unsigned 或非 zdr 的 child_edu）。
#
# verification_max_age_days 用 schema 示例里的 90。设计稿 §8 只说过期停用，没有另定天数。
# 留存：草案写明「有例外」或「会留存」的，照实映射；
# 留存本身没核实，或「有例外」依赖一条没核实的前提时，写 retained。

schema_version: 1
verification_max_age_days: 90

endpoints:
  - provider: deepinfra
    model: deepseek-ai/DeepSeek-V3.2
    endpoint: openai-chat-completions
    access: api
    processing_regions: [unknown]
    retention: with_exceptions
    dpa: unsigned
    allowed_data_classes: []
    capabilities:
      tool_calling: true
      stream_usage: true
      cache_pricing: true
      structured_output: true
      cancellation: false
    verified_at: "2026-11-12"
    notes: |
      留存为有例外：条款第 7(b) 条把排障（解决后 30 天）、不含正文的元数据、法律与滥用、批量、图像、第三方模型和付费缓存列为 ZDR 例外。本型号不是 Google 或 Anthropic 通道。转售默认禁止，除非服务订单明文允许。没有查到儿童业务专条，允许的数据类别草案为 unverified，故为空列表。首页和隐私政策写美国数据中心，但城市、美国以外节点未核实，条款又允许迁移基础设施，区域未合同锁定，所以区域写 unknown。取消未核实。标准档 USD/1M token：输入 0.26，缓存输入 0.13，输出 0.38。DPA 正文未打开，本项目未签。
    evidence:
      - "https://deepinfra.com/terms"
      - "https://deepinfra.com/privacy"
      - "https://deepinfra.com/"
      - "https://trust.deepinfra.com/"
      - "https://docs.deepinfra.com/account/data-privacy"
      - "https://docs.deepinfra.com/chat/streaming"
      - "https://docs.deepinfra.com/api-reference/chat-completions/openai-chat-completions"
      - "https://deepinfra.com/deepseek-ai/DeepSeek-V3.2"
      - "https://deepinfra.com/pricing"

