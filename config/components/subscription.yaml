# T1.4.2 能力①：订阅中转组件卡（个人模式，best-effort）
#
# 安全语义（不要照抄到多租户部署）：
#  - provider.tier=remote + privacy_class=any ⇒ 永不被 local_only 请求选中，
#    也永不出现在 routing-policy 的 default 链（default 只有 local）。
#  - allowed_egress 固定 [loopback]：订阅请求的来源必须是 loopback。
#  - 真正注册还需 deploy_mode=personal 且显式 IDORIS_ENABLE_SUBSCRIPTION=1
#    + IDORIS_SUBSCRIPTION_SANDBOX；否则 registry 跳过或拒绝启动。
#  - kill switch：IDORIS_DISABLE_SUBSCRIPTION=1 优先于 enable；这是启动快照，
#    需要优雅重启才生效，不是运行时热开关。
#  - 当前安全边界是 best-effort：CLI 固定安全 argv + request-private workspace +
#    环境凭据 scrub + loopback 来源门禁；不宣称隔离 HOME 登录态、CLI 网络目的地
#    或主动 setsid/setpgid 脱组的恶意后代。
#  - CLI 升级后必须重新跑显式 opt-in 的 subscription_real smoke；安全 flags
#    不兼容时 fail-closed，禁止剥 flag 回退。
provider:
  id: subscription
  family: other
  tier: remote
  capabilities: [chat, reasoning, coding]
  privacy_class: any
  cost: { input_per_m: 0, output_per_m: 0 }
  locality: loopback
form: spawn_cli
endpoint: "spawn://subscription"
version_pin: "subscription-relay@0.1.0"
privacy_class: any
allowed_egress: [loopback]
fallback_policy: next_in_chain
fail_closed: false
extensions:
  _degradation: "订阅中转不可用时降级到本地模型或已配置的外部 API 槽位；不使用 CLI 的任何原生特性"
  subscription:
    sandbox_profile: "idoris-subscription-no-tools-readonly-v1"
    default_cli: claude
