provider:
  id: llama-long
  family: local
  tier: local
  capabilities: [chat]
  privacy_class: local_only
  cost: { input_per_m: 0, output_per_m: 0 }
  locality: loopback
form: http_service
endpoint: "http://127.0.0.1:18102"
version_pin: "llama.cpp"
privacy_class: local_only
allowed_egress: [loopback]
